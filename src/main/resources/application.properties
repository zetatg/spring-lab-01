spring.application.name=spring-lab-01
server.port=8080
app.owner=Turmakov Akylbek, IS-2407
logging.level.web=INFO
app.date-pattern=yyyy-MM-dd HH:mm:ss

# ---- Lab 8 ----
# "demo" switches on Lab8Demo (step 12). Remove ",demo" before the live demonstration.
spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/springlab
spring.datasource.username=springlab
spring.datasource.password=springlab

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true