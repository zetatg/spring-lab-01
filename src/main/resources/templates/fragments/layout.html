<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- used as: <head th:replace="~{fragments/layout :: head(#{some.key})}"></head> -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — ' + #{app.name}">Catalogue — Book Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- active: list | new | admin | none;  langPath: where the EN/RU/KZ links lead -->
<header class="site-header" th:fragment="header(active, langPath)">
    <div class="wrap bar">
        <a class="brand" th:href="@{/}" th:text="#{app.name}">Book Catalogue</a>

        <nav class="nav" aria-label="Main">
            <a th:href="@{/books}" th:text="#{nav.catalogue}"
               th:classappend="${active == 'list'} ? 'is-active'"
               th:attr="aria-current=${active == 'list'} ? 'page'">Catalogue</a>
            <!-- hiding is a courtesy, not a control: the URL rule and @PreAuthorize protect the endpoint -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/new}" th:text="#{book.new}"
               th:classappend="${active == 'new'} ? 'is-active'"
               th:attr="aria-current=${active == 'new'} ? 'page'">New book</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:text="#{nav.admin}"
               th:classappend="${active == 'admin'} ? 'is-active'"
               th:attr="aria-current=${active == 'admin'} ? 'page'">Administration</a>
        </nav>

        <div class="bar-right">
            <span class="lang" th:attr="aria-label=#{lang.label}">
                <a th:href="@{${langPath}(lang='en')}" lang="en" hreflang="en" title="English"
                   th:classappend="${#locale.language == 'en'} ? 'is-active'">EN</a>
                <a th:href="@{${langPath}(lang='ru')}" lang="ru" hreflang="ru" title="Русский"
                   th:classappend="${#locale.language == 'ru'} ? 'is-active'">RU</a>
                <a th:href="@{${langPath}(lang='kk')}" lang="kk" hreflang="kk" title="Қазақша"
                   th:classappend="${#locale.language == 'kk'} ? 'is-active'">KZ</a>
            </span>

            <!-- lab 10, task 3.3: the view knows who is looking at it -->
            <span class="user" sec:authorize="isAuthenticated()">
                <span class="user-name" sec:authentication="name">user</span>
                <span class="user-roles" sec:authentication="principal.authorities">[ROLE_USER]</span>
                <!-- logout changes state, so it is a POST form (Thymeleaf adds the _csrf field) -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="link-button" th:text="#{nav.logout}">Log out</button>
                </form>
            </span>
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" th:text="#{nav.login}">Log in</a>
        </div>
    </div>
</header>

<!-- the catalogue as a table; used by the catalogue page and the home page -->
<table class="catalogue" th:fragment="catalogue(books)">
    <thead>
    <tr>
        <th class="col-no" scope="col" th:text="#{card.no}">No.</th>
        <th scope="col" th:text="#{book.title}">Title</th>
        <th scope="col" th:text="#{book.author}">Author</th>
        <th scope="col" th:text="#{book.publisher}">Publisher</th>
        <th scope="col" th:text="#{book.genre}">Genre</th>
        <th class="col-year" scope="col" th:text="#{book.year}">Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td class="col-no" th:attr="data-label=#{card.no}" th:text="${book.id}">1</td>
        <td class="col-title" th:attr="data-label=#{book.title}">
            <div>
                <span class="title" th:text="${book.title}">Effective Java</span>
                <span class="isbn" th:if="${book.isbn != null}" th:text="'ISBN ' + ${book.isbn}">ISBN 978-0-13-468599-1</span>
            </div>
        </td>
        <td th:attr="data-label=#{book.author}" th:text="${book.author?.name}">Joshua Bloch</td>
        <td th:attr="data-label=#{book.publisher}"
            th:text="${book.publisher != null} ? ${book.publisher.name} : '—'">Addison-Wesley</td>
        <td th:attr="data-label=#{book.genre}" th:text="#{${'genre.' + book.genre.name()}}">Programming</td>
        <td class="col-year" th:attr="data-label=#{book.year}" th:text="${book.year}">2018</td>
    </tr>
    <tr class="empty" th:if="${#lists.isEmpty(books)}">
        <td colspan="6" th:text="#{catalog.empty}">No books found.</td>
    </tr>
    </tbody>
</table>

<footer class="site-footer" th:fragment="footer">
    <div class="wrap foot">
        <span th:text="#{footer.note}">Course project built with Spring Boot.</span>
        <span class="foot-links">
            <a th:href="@{/swagger-ui.html}">Swagger UI</a>
            <a th:href="@{/h2-console}">H2 console</a>
        </span>
    </div>
</footer>

</body>
</html>
