<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.title})}">
    <title>Administration</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header('admin', '/admin')}"></header>

<main class="wrap">
    <div class="page-head">
        <div>
            <h1 th:text="#{admin.title}">Administration</h1>
            <p class="meta" th:text="#{admin.lead}">Users are loaded from app_user; only BCrypt hashes are stored.</p>
        </div>
    </div>

    <div class="table-card">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th th:text="#{admin.username}">Username</th>
                <th th:text="#{admin.roles}">Roles</th>
                <th th:text="#{admin.enabled}">Enabled</th>
                <th th:text="#{admin.hash}">Password hash</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td class="num" th:text="${u.id}">1</td>
                <td><strong th:text="${u.username}">admin</strong></td>
                <td>
                    <span class="chip" th:each="r : ${u.roles}" th:text="${r}">ADMIN</span>
                </td>
                <td>
                    <span class="status" th:classappend="${u.enabled} ? 'status-on' : 'status-off'"
                          th:text="${u.enabled} ? #{admin.yes} : #{admin.no}">yes</span>
                </td>
                <!-- only the first 20 characters: enough to show the $2a$10$ prefix and the salt -->
                <td><code class="hash" th:text="${#strings.substring(u.passwordHash, 0, 20)} + '…'">$2a$10$Qh.EZxbWZot2n…</code></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
