<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{error.notfound.title})}">
    <title>Book not found</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header('none', '/books')}"></header>

<main class="wrap">
    <h1 th:text="#{error.notfound.title}">Book not found</h1>
    <p class="lead" th:text="#{error.notfound.text}">There is no book with this number in the catalogue. It may have been removed.</p>

    <div class="narrow-block">
        <ol class="shelf">
            <li class="spine spine-gap" th:text="${message != null} ? ${message} : #{error.notfound.title}">Book with id 42 not found</li>
        </ol>
    </div>

    <p class="actions">
        <a class="btn" th:href="@{/books}" th:text="#{error.notfound.back}">Back to the catalogue</a>
    </p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
