<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{catalog.title})}">
    <title>Catalogue</title>
</head>
<body>

<header th:replace="~{fragments/layout :: header('list', '/books')}"></header>

<main class="wrap">

    <div class="page-head">
        <div>
            <h1 th:text="#{catalog.title}">Catalogue</h1>
            <p class="meta" th:text="#{catalog.count(${#lists.size(books)})}">Found: 6</p>
        </div>
        <a class="btn" th:href="@{/books/new}" th:text="#{book.new}">New book</a>
    </div>

    <!-- success message after adding a book (flash attribute) -->
    <p class="notice" role="status" th:if="${addedTitle != null}"
       th:text="#{flash.added(${addedTitle})}">Book «Example» has been added</p>

    <form class="filter" th:action="@{/books}" method="get" role="search">
        <label class="sr-only" for="author" th:text="#{book.author}">Author</label>
        <input id="author" type="search" name="author" autocomplete="off"
               th:value="${author}" th:placeholder="#{filter.placeholder}" placeholder="Author name">
        <button type="submit" class="btn btn-secondary" th:text="#{filter.apply}">Search</button>
        <a class="link-quiet" th:href="@{/books}" th:text="#{filter.clear}"
           th:if="${!#strings.isEmpty(author)}">Clear</a>
    </form>

    <ol class="shelf">
        <th:block th:each="book : ${books}">
            <li th:replace="~{fragments/layout :: spine(${book})}"></li>
        </th:block>

        <li class="spine spine-gap" th:if="${#lists.isEmpty(books)}"
            th:text="#{catalog.empty}">No books found.</li>
    </ol>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
