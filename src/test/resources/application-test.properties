# Used with @ActiveProfiles("test"): in-memory H2 + Flyway, no PostgreSQL needed.
spring.datasource.url=jdbc:h2:mem:txlab;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Flyway owns the accounts/audit_log schema; Hibernate only adds the older Lab 1-8 catalog tables.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
